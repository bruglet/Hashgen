name: Server compatibility and AppLocker validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -f Containerfile -t hashgen:test .
      - name: Verify client is absent from the server image
        run: docker run --rm --entrypoint sh hashgen:test -c 'test -z "$(find / -name HashgenClient.ps1 -print 2>/dev/null)"'

  applocker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-windows.txt
      - name: Test downloadable client policy logic (no device changes)
        shell: powershell
        run: ./tests/test_windows_client.ps1
      - name: Compare hashes and evaluate policies using native AppLocker
        shell: powershell
        run: ./tests/verify_applocker.ps1
